[package]
name = "jupiter"
version = "0.1.0"
authors = ["Patton Doyle <patton@DecodeDetroit.com>"]
description = "Player and Puzzle Management Software"
license = "GPL-3.0-or-later"
edition="2024"

[profile.release]
lto = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
fnv = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.34-deprecated"
serde_json = "1.0"
redis = "1.7"
tokio = { version = "1.53", features = ["macros", "process", "rt-multi-thread", "time"] }
warp = { version = "0.3", features = ["tls"] }
async-stream = "0.3"
async-recursion = "1.1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
reqwest = { version = "0.13", features = ["json"] }
thread_local = "1.1"
single-instance = "0.3"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
console-subscriber = { version = "0.5", optional = true }
system_shutdown = "4.1"

[features]
no_can_limit = []
tokio_console = ["console-subscriber"]
